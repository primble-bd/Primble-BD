 if(tab==='home')b=`${S.banners.length?`<div class="bn" style="margin-bottom:14px">${S.banners.map(x=>`<img src="${x.src}" alt="">`).join('')}</div>`:''}<div class="g g2"><div class="amx" onmousemove="tilt(event,this)" onmouseleave="this.style.transform=''"><div class="sh"></div><div class="top"><b class="lg">${S.cfg.logo?`<img src="${S.cfg.logo}" style="height:22px;vertical-align:middle;margin-right:6px;border-radius:4px;background:#fff">`:''}${esc(CN().toUpperCase())}</b><span class="tp">${{STAFF:'STAFF',GENERAL_CUSTOMER:'MEMBER',VIP_CUSTOMER:'VIP'}[u.role]||'MEMBER'}</span></div><div class="chip"></div><svg class="nfc" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 010 8M10 6a10 10 0 010 12M14 4a14 14 0 010 16"/></svg><div class="no2 n">${u.acc.replace(/(\d{4})(?=\d)/g,'$1 ')}</div><div class="bt"><div><small>CARD MEMBER</small><b>${esc(u.name.toUpperCase())}</b></div><div><small>MEMBER SINCE</small><b class="n">${(u.time||'').slice(6,10)||'2026'}</b></div><div class="bal"><small>BALANCE</small><b class="n${showBal?' rv':''}">${showBal?fm(u.bal):'৳ ••••••'}</b></div></div></div><div class="g"><div class="qa"><button onclick="go('add')"><i>${ic('plus',22)}</i>Add Money</button><button onclick="go('wd')"><i>${ic('bank',22)}</i>Withdraw</button><button onclick="go('send')"><i>${ic('send',22)}</i>Send Money</button><button onclick="go('sal')"><i>${ic('brief',22)}</i>Salary</button></div><div class="card"><b>Recent transactions</b>${txl(my.slice(0,4))}</div></div></div>`;
 if(tab==='tx')b=`<div class="card"><h3>Transactions</h3><button class="p" onclick="stmt()" style="margin-bottom:10px">${ic('dl',16)} Download statement (PDF)</button>${txl(my)}</div>`;
 if(tab==='sal')b=`<div class="card"><h3>Salary & Profit</h3>${txl(my.filter(t=>/Salary|Profit/i.test(t.note)))}</div>`;
 if(tab==='sms')b=`<div class="card"><h3>SMS Inbox</h3>${ms.length?ms.map(m=>`<div class="row"><div><b>${esc(m.t)}</b><div>${esc(m.b)}</div><div class="m">Primble BD LTD Admin · ${m.time}</div></div></div>`).join(''):'<p class="m">No messages</p>'}</div>`;
 if(tab==='send')b=`<div class="card"><h3>Send Money</h3><label>13-digit account number</label><input id="acn" class="n" inputmode="numeric" maxlength="13"><button class="o" onclick="chk()">Next ${ic('arrow',16)}</button>${look?(look.ok?`<div class="card" style="margin-top:12px"><div style="display:flex;gap:12px;align-items:center;animation:up .4s">${look.u.photo?`<img src="${look.u.photo}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--r)">`:''}<div><b>${esc(look.u.name)}</b><div class="m n">${look.u.acc}</div></div></div><form onsubmit="send(event)"><label>Amount (৳)</label><input name="amt" type="number" min="1" step="0.01" required><div class="nv"><button type="button" class="o" onclick="look=null;render()">${ic('back',16)} Back</button><button class="p">Confirm & send</button></div></form></div>`:`<div class="msg" style="margin-top:12px">Account does not exist. Transaction aborted.</div>`):''}</div>`;
 if(tab==='add')b=`<div class="card"><h3>Add Money</h3><p class="m">First Send Money to the company number (ask the admin for it), then enter the details below.</p><form onsubmit="req(event,'ADD')"><label>Operator</label>${partTiles('MFS')}<label>Your sender number</label><input name="ext" required><label>TrxID</label><input name="trx" required><label>Amount (৳)</label><input name="amt" type="number" required><button class="p">Submit</button></form></div>`;
 if(tab==='wd')b=`<div class="card"><h3>Withdraw</h3><form onsubmit="req(event,'MFS')"><b>Mobile banking</b><br>${partTiles('MFS')}<label>Number</label><input name="ext" required><label>Amount (৳)</label><input name="amt" type="number" required><button class="p">Request</button></form></div><div class="card"><form onsubmit="req(event,'BANK')"><b>Bank transfer</b><br>${partTiles('BANK')}<label>Account holder name</label><input name="name" required><label>Bank account number</label><input name="ext" required><label>Amount (৳)</label><input name="amt" type="number" required><button class="p">Request</button></form></div>`;
 if(tab==='me')b=profileView(u)+pwForm;
 const T=[['home','home','Home'],['tx','list','Transactions'],['sms','mail','SMS'+(un?' •':'')],['me','user','Profile']];
 return hdr(u)+`<div class="w">${msgBox()}${['send','add','wd','sal'].includes(tab)?`<button class="o" onclick="go('home')" style="margin-bottom:12px">${ic('back',16)} Back</button>`:''}${b}</div><nav>${T.map(t=>`<button class="${tab===t[0]?'a':''}" onclick="go('${t[0]}')"><i>${ic(t[1],22)}</i>${t[2]}</button>`).join('')}</nav>`}
function adminView(u){const T=[['dash','grid','Dashboard'],['kyc','shield','KYC Approvals'],['add','plus','Add Money'],['wd','bank','Withdrawals'],['pay','cash','Salary & Profit'],['sms','chat','SMS Composer'],['ban','img','Banners'],['part','bank','Partners'],['users','users','Users'],['brand','gear','Settings'],['bk','db','Backup'],['prof','user','My Profile'],['me','lock','Security']];let b='';
 const rq=(types)=>{const l=S.reqs.filter(r=>types.includes(r.type));return l.length?l.map(r=>{const x=S.users.find(y=>y.id===r.uid);return `<div class="row"><div><b>${esc(x.name)}</b> · <span class="n">${fm(r.amt)}</span><div class="m">${r.type} · ${esc(r.op)} · ${esc(r.name)} ${esc(r.ext)} ${r.trx?'TrxID: '+esc(r.trx):''}</div><div class="m">${r.time} · ${r.st}</div></div>${r.st==='PENDING'?`<div><button class="p" onclick="act('${r.id}',1)">Approve</button> <button class="o" onclick="act('${r.id}',0)">Reject</button></div>`:''}</div>`}).join(''):'<p class="m">No requests</p>'};
 if(tab==='kyc'){const l=S.users.filter(x=>x.kyc==='PENDING');b=`<div class="card"><h3>Pending KYC</h3><p class="m">Auto-approval is ${S.cfg.auto?'ON':'OFF'} (change it in Settings).</p>${l.length?l.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> · ${x.role}<div class="m">${esc(x.ph)} ${esc(x.email||'')} · ID/NID: ${esc(x.doc)}</div>${imgs(x)}</div><div><button class="p" onclick="kyc('${x.id}',1)">Approve</button> <button class="o" onclick="kyc('${x.id}',0)">Reject</button></div></div>`).join(''):'<p class="m">No pending applications</p>'}</div>`}
 if(tab==='users')b=`<div class="card"><h3>All users</h3>${S.users.filter(x=>!x.admin).map(x=>`<div class="row"><div><b>${esc(x.name)}</b> · ${x.kyc}${x.frozen?' · FROZEN':''}<div class="m n">${x.acc||'-'} · ${fm(x.bal)}</div>${imgs(x)}</div>${x.kyc==='APPROVED'?`<button class="o" onclick="frz('${x.id}')">${x.frozen?'Unfreeze':'Freeze'}</button>`:''}</div>`).join('')||'<p class="m">No one yet</p>'}</div>`;
 if(tab==='add')b=`<div class="card"><h3>Add Money Queue</h3>${rq(['ADD'])}</div>`;
 if(tab==='wd')b=`<div class="card"><h3>Withdrawal Requests</h3>${rq(['BANK','MFS'])}</div>`;
 if(tab==='pay')b=`<div class="card"><h3>Salary / Profit Share</h3><form onsubmit="pay(event)"><label>To</label><select name="to"><option value="ALL">All staff</option>${uopt()}</select><label>Type</label><select name="kind"><option>Salary</option><option>Profit Share</option></select><label>Amount (৳)</label><input name="amt" type="number" required><button class="p">Submit</button></form></div>`;
 if(tab==='sms')b=`<div class="card"><h3>SMS Composer</h3><form onsubmit="sms(event)"><label>Recipient</label><select name="to">${uopt(1)}</select><label>Title</label><input name="t" required><label>Message (editable)</label><textarea name="b" rows="4" required>Your account transaction was completed.</textarea><button class="p">Send</button></form></div>`;
 if(tab==='ban')b=`<div class="card"><h3>Banners (unlimited)</h3><p class="m">Changes are saved only when you press Save.</p><input type="file" accept="image/*" multiple onchange="addBan(this)"><div class="g g2">${D().ban.map(x=>`<div class="bx"><img src="${x.src}" style="width:100%;border-radius:12px"><button class="x" onclick="delBan('${x.id}')">${ic('x',14)}</button></div>`).join('')}</div><div class="nv"><button class="o" onclick="go('dash')">${ic('back',16)} Back</button><button class="p" onclick="S.banners=D().ban.slice();sv();dr=null;flash('Banners saved')">${ic('save',16)} Save</button></div></div>`;
 if(tab==='brand')b=`<div class="card"><h3>Settings</h3><p class="m">Changes are saved only when you press Save.</p><label>Logo (from device)</label>${D().cfg.logo?`<img src="${D().cfg.logo}" style="height:80px;border-radius:10px;background:#fff;padding:2px;display:block;margin:6px 0">`:''}<input type="file" accept="image/*" onchange="setLogo(this)"><label>Company name</label><input value="${esc(D().cfg.name||'Primble BD LTD')}" oninput="D().cfg.name=this.value"><label><input type="checkbox" style="width:auto" ${D().cfg.auto?'checked':''} onchange="D().cfg.auto=this.checked?1:0"> Auto-approve accounts after OTP verification</label><div class="nv"><button class="o" onclick="go('dash')">${ic('back',16)} Back</button><button class="p" onclick="S.cfg={...D().cfg,name:(D().cfg.name||'').trim()||'Primble BD LTD'};sv();dr=null;flash('Settings saved')">${ic('save',16)} Save</button></div></div>`;
 if(tab==='bk')b=`<div class="card"><h3>Device backup (pbdbank.file)</h3><p class="m">Once you pick a file, every change is saved to it automatically.</p><button class="p" onclick="bkOn()">Enable auto-save</button> <button class="o" onclick="bkDl()">pbdbank.file Download</button><p><label>Restore from backup</label><input type="file" onchange="bkRs(this)"></p></div>`;
 if(tab==='dash')b=dashView();
 if(tab==='prof')b=profileView(u);
 if(tab==='part')b=`<div class="card"><h3>Payment partners</h3><p class="m">Upload each partner's official logo (take it from their brand kit). Changes are saved only when you press Save.</p>${D().parts.map(x=>`<div class="row"><div style="display:flex;gap:12px;align-items:center">${plogo(x,44)}<div><b>${esc(x.name)}</b><div class="m">${x.type==='MFS'?'Mobile banking':'Bank'}</div></div></div><div><label class="up">${ic('img',16)} Logo<input type="file" accept="image/*" hidden onchange="partLogo(this,'${x.id}')"></label> <button class="d" onclick="partDel('${x.id}')">${ic('x',14)}</button></div></div>`).join('')}<div class="row"><input id="pn" placeholder="New partner name" style="margin:0"><select id="pt" style="margin:0;width:auto"><option value="BANK">Bank</option><option value="MFS">Mobile banking</option></select><button class="o" onclick="partAdd()">${ic('plus',16)} Add</button></div><div class="nv"><button class="o" onclick="go('dash')">${ic('back',16)} Back</button><button class="p" onclick="S.partners=D().parts.map(x=>({...x}));sv();dr=null;flash('Partners saved')">${ic('save',16)} Save</button></div></div>`;
 if(tab==='me')b=(u.pin===dflt?`<div class="msg">${ic('alert',16)} You are using the default password. Change it now.</div>`:'')+pwForm;
 const cur=T.find(t=>t[0]===tab)||T[0];return `<div class="adm"><aside class="sb"><div class="lg0">${logoImg(38)}<b>${esc(CN())}</b></div>${T.map(t=>`<button class="ni ${tab===t[0]?'a':''}" onclick="go('${t[0]}')">${ic(t[1],18)}<span>${t[2]}</span></button>`).join('')}</aside><main class="mn"><div class="tb"><div><h2>${cur[2]}</h2><div class="m">Admin console</div></div><div class="tr">${u.photo?`<img class="tav" src="${u.photo}" alt="">`:`<span class="tav">${esc(u.name[0])}</span>`}<button class="o" onclick="out()">${ic('logout',16)} Log out</button></div></div>${msgBox()}${b}</main></div>`}
function render(){const a=document.getElementById('app');if(!S){a.innerHTML='';return}const u=mid&&U();a.innerHTML=!u?(lk?lockView():mode==='home'?landing():mode==='register'&&rstep===2?otpView():authView()):u.admin?adminView(u):userView(u);if(!u&&!lk&&mode==='home')initLand();if(u&&u.admin&&tab==='dash')cu()}
init();
</script></body></html>
