name: Build Primble BD Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & sync Capacitor Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Prepare Android release keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          else
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias "${{ vars.ANDROID_KEY_ALIAS || 'primble' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'PrimbleBD@2026' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'PrimbleBD@2026' }}" \
              -dname "CN=Primble BD LTD, OU=Mobile, O=Primble BD LTD, L=Dhaka, C=BD"
          fi

      - name: Build Signed APK and Play Store AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'PrimbleBD@2026' }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'primble' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'PrimbleBD@2026' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Package APK & AAB outputs
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk android-artifacts/Primble-BD-LTD.apk
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifacts/Primble-BD-LTD.aab

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Primble-BD-LTD-APK-and-AAB
          path: |
            android-artifacts/Primble-BD-LTD.apk
            android-artifacts/Primble-BD-LTD.aab
